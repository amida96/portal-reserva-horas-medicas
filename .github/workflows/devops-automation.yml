name: Validacion Continua DevOps
on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
jobs:
  validar-proyecto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos obligatorios
        run: |
          test -f src/index.html
          test -f src/styles.css
          test -f Dockerfile
          test -f docker-compose.yml
          test -f .env.example
          test -f .gitignore
          test -f README.md
      - name: Validar imagen Docker
        run: docker build -t reserva-horas-medicas:ci-test .
